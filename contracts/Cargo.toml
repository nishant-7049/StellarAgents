[workspace]
resolver = "2"
members = [
    "vault-factory",
    "user-vault",
    "agent-registry",
    "reputation-registry",
    "validation-registry",
]

[workspace.dependencies]
soroban-sdk = "=25.0.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
